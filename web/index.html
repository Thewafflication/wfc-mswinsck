<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfc-mswinsck in WebAssembly</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --card: #fff; --ink: #1b1f24;
    --muted: #5b6573; --line: #d8dde4; --accent: #0b5fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --card: #1d2229;
    --ink: #e8ebf0; --muted: #98a2b0; --line: #2d3540; --accent: #6ea0ff; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .counts { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  code { font: 12.5px ui-monospace, Consolas, monospace; }
  .list { color: var(--accent); }
  .more { color: var(--muted); }
  footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">wfc-mswinsck</h1>
  <p class="sub" id="sub">Loading the WebAssembly module...</p>
  <div class="cards" id="cards"></div>
  <footer>The class and member names come from the library's member table,
  compiled to WebAssembly with Emscripten.</footer>
</main>
<script src="mswinsck.js"></script>
<script>
  create_mswinsck().then((m) => {
    const text = (name, ...args) => m.UTF8ToString(m.ccall(name, 'number', args.map(() => 'number'), args));
    const num = (name, ...args) => m.ccall(name, 'number', args.map(() => 'number'), args);
    document.getElementById('title').textContent =
      text('library_name') + ' in WebAssembly';
    document.getElementById('sub').textContent =
      'version ' + text('library_version') + ', targets ' + text('library_target');
    const cards = document.getElementById('cards');
    for (let c = 0; c < num('class_count'); c++) {
      const members = num('member_count', c), events = num('event_count', c);
      const names = [];
      for (let i = 0; i < Math.min(members, 8); i++) names.push(text('member_name', c, i));
      const handlers = [];
      for (let i = 0; i < Math.min(events, 4); i++) handlers.push(text('event_name', c, i));
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h2></h2><div class="counts"></div><code class="list"></code>' +
        '<div><code class="more"></code></div>';
      card.querySelector('h2').textContent = text('class_name', c);
      card.querySelector('.counts').textContent = members + ' members, ' + events + ' events';
      card.querySelector('.list').textContent = names.join(', ') + (members > 8 ? ', ...' : '');
      card.querySelector('.more').textContent =
        events ? 'events: ' + handlers.join(', ') + (events > 4 ? ', ...' : '') : '';
      cards.appendChild(card);
    }
    const ready = document.createElement('span');
    ready.id = 'ready';
    ready.hidden = true;
    document.body.appendChild(ready);
  });
</script>
</body>
</html>
